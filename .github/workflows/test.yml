name: Python Tests con Pytest
on: [push]

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4 

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: Instalar Pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest # Instala la librería necesaria

    - name: Ejecutar Tests
      run: |
        python -m pytest # Ejecuta tus pruebas automáticas